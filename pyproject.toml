[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "watchpost-siem"
dynamic = ["version"]
description = "Trace security logs to alerts and incidents in a local Python and SQLite lab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Talal Kashar"}]
keywords = ["siem", "soc", "log-analysis", "detection-engineering", "incident-response"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/talalkashar/watchpost"
Documentation = "https://github.com/talalkashar/watchpost#quick-start"
Demo = "https://watchpost-nxxu.onrender.com"
Issues = "https://github.com/talalkashar/watchpost/issues"

[project.scripts]
watchpost-demo = "watchpost.demo:main"
watchpost-serve = "watchpost.launcher:run"

[tool.hatch.version]
path = "watchpost/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["watchpost"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "watchpost/static"
"samples" = "watchpost/samples"
