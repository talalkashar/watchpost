# nginx with a self-signed certificate, for a VM reached by bare IP (no domain).
# Browsers will warn about the certificate; that is expected for a self-signed cert.
# install.sh --nginx-selfsigned creates the certificate at /etc/ssl/watchpost/ and installs
# this file as /etc/nginx/sites-available/watchpost (enabled, replacing the default site).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/watchpost/watchpost.crt;
    ssl_certificate_key /etc/ssl/watchpost/watchpost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:watchpost:1m;
    ssl_session_timeout 1h;

    server_tokens off;
    # A little above SIEM_MAX_UPLOAD_BYTES (5 MB) so the app, not nginx, answers oversize uploads.
    client_max_body_size 6m;

    # Replace (not append) X-Forwarded-For so clients cannot spoof the IP used for rate limiting.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    # Server-Sent Events: no buffering, long-lived connection.
    location = /api/stream {
        proxy_pass http://127.0.0.1:8080;
        # A proxy_set_header here replaces the server-level ones, so repeat them.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
