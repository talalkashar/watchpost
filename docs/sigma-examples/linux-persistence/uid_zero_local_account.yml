# Local account persistence (T1136.001). useradd or usermod forced to UID 0, not a normal useradd.
title: Linux UID Zero Local Account Creation
id: e2b75c14-8d09-4a63-b7f1-5c8e1a4d6b90
status: experimental
description: |
  useradd or usermod was invoked with -u 0, which creates or converts a local account into
  another UID 0 identity. A normal useradd without -u 0 does not match.
  logsource does not filter in Watchpost, so web, firewall, network, and VPN events
  (event.action network_or_web) are excluded: a scanner probing the same path does not match.
  Host lines that normalize to other or syslog, such as auditd EXECVE records and shell
  command logs, still match. A web access line forwarded through syslog is stored as other
  and is not excluded.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1136/001/
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: process_creation
  product: linux
detection:
  network_or_web:
    event.action:
      - web_request
      - web_scan
      - web_error
      - fw_deny
      - fw_allow
      - network_connection
      - vpn_login
  selection_useradd:
    message|contains|all:
      - 'useradd'
      - '-u 0'
  selection_usermod:
    message|contains|all:
      - 'usermod'
      - '-u 0'
  condition: (1 of selection_*) and not network_or_web
falsepositives:
  - Rare recovery work that intentionally creates a second UID 0 account
level: critical
