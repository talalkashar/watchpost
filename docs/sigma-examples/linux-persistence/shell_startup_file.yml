# Unix shell startup persistence (T1546.004). Writes to profile or rc files, not the shell sourcing them.
title: Linux Shell Startup File Modification
id: c4d92f58-1a7b-4e36-8d05-6b3c9a2e7f18
status: experimental
description: |
  A command appended or rewrote a user or system shell startup file (.bashrc, .profile, .zshrc,
  /etc/profile, /etc/bash.bashrc). A shell sourcing the file at login does not match.
  logsource does not filter in Watchpost, so web, firewall, network, and VPN events
  (event.action network_or_web) are excluded: a scanner probing the same path does not match.
  Host lines that normalize to other or syslog, such as auditd EXECVE records and shell
  command logs, still match. A web access line forwarded through syslog is stored as other
  and is not excluded.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1546/004/
tags:
  - attack.persistence
  - attack.t1546.004
logsource:
  category: process_creation
  product: linux
detection:
  network_or_web:
    event.action:
      - web_request
      - web_scan
      - web_error
      - fw_deny
      - fw_allow
      - network_connection
      - vpn_login
  selection_file:
    message|contains:
      - '.bashrc'
      - '.bash_profile'
      - '.bash_login'
      - '.profile'
      - '.zshrc'
      - '.zprofile'
      - '/etc/profile'
      - '/etc/bash.bashrc'
  selection_write:
    message|contains:
      - 'tee '
      - 'echo '
      - 'sed -i'
      - '>>'
  condition: (selection_file and selection_write) and not network_or_web
falsepositives:
  - A user or configuration management editing a shell rc file
level: high
