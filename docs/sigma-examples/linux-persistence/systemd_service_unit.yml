# Systemd service persistence (T1543.002). Matches unit-file paths, not systemctl status/cat/show.
title: Linux Systemd Service Unit Persistence
id: a3f8c2d1-6e40-4b97-8a15-2d9c7e4b0f63
status: experimental
description: |
  A command wrote or referenced a unit path under the system or user systemd directories.
  Read-only systemctl status, cat, and show lines are excluded.
  logsource does not filter in Watchpost, so web, firewall, network, and VPN events
  (event.action network_or_web) are excluded: a scanner probing the same path does not match.
  Host lines that normalize to other or syslog, such as auditd EXECVE records and shell
  command logs, still match. A web access line forwarded through syslog is stored as other
  and is not excluded.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1543/002/
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1543.002
logsource:
  category: process_creation
  product: linux
detection:
  network_or_web:
    event.action:
      - web_request
      - web_scan
      - web_error
      - fw_deny
      - fw_allow
      - network_connection
      - vpn_login
  selection:
    message|contains:
      - '/etc/systemd/system/'
      - '/usr/lib/systemd/system/'
      - '/lib/systemd/system/'
      - '.config/systemd/user/'
  filter_read:
    message|contains:
      - 'systemctl status'
      - 'systemctl cat'
      - 'systemctl show'
  condition: (selection and not filter_read) and not network_or_web
falsepositives:
  - Package installers and administrators adding a reviewed unit under /etc/systemd/system
level: high
