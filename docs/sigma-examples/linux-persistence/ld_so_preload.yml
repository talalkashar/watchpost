# Dynamic linker hijack (T1574.006). ld.so.preload and LD_PRELOAD= are rare outside an attack.
title: Linux Dynamic Linker Preload Persistence
id: d6a03b81-9f24-4c57-a1e8-3b5d7c0e9a42
status: experimental
description: |
  A command referenced /etc/ld.so.preload or set LD_PRELOAD. Rebuilding /etc/ld.so.cache
  does not contain either string.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1574/006/
tags:
  - attack.persistence
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1574.006
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    message|contains:
      - '/etc/ld.so.preload'
      - 'LD_PRELOAD='
  condition: selection
falsepositives:
  - A developer intentionally preloading a library while debugging
level: critical
