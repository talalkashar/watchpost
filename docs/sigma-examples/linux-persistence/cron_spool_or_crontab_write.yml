# Cron persistence (T1053.003). Matches crontab installs and writes into the cron spool or cron.d,
# not the cron daemon running an existing job and not `crontab -l`.
title: Linux Cron Spool Or Crontab Write
id: 7c1e4a90-2b6d-4f18-9c3a-81d5e0b47f21
status: experimental
description: |
  A process wrote a crontab or a file under the cron spool, /etc/cron.d, or /etc/crontab.
  Listing the crontab and the cron daemon's own job lines are excluded.
  logsource does not filter in Watchpost, so web, firewall, network, and VPN events
  (event.action network_or_web) are excluded: a scanner probing the same path does not match.
  Host lines that normalize to other or syslog, such as auditd EXECVE records and shell
  command logs, still match. A web access line forwarded through syslog is stored as other
  and is not excluded.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1053/003/
tags:
  - attack.persistence
  - attack.t1053.003
logsource:
  category: process_creation
  product: linux
detection:
  network_or_web:
    event.action:
      - web_request
      - web_scan
      - web_error
      - fw_deny
      - fw_allow
      - network_connection
      - vpn_login
  selection:
    message|contains:
      - 'crontab -'
      - '/var/spool/cron/'
      - '/etc/cron.d/'
      - '/etc/crontab'
  filter_list:
    message|contains:
      - 'crontab -l'
  condition: (selection and not filter_list) and not network_or_web
falsepositives:
  - An administrator installing a reviewed crontab or a package script dropping a file in /etc/cron.d
level: high
