# WinRM listens on 5985 (HTTP) and 5986 (HTTPS). wsmprovhost.exe is the remote shell host.
# A connection the host makes to itself, and ordinary HTTPS, do not match.
title: Windows Remote Management WinRM Session
id: d7fac8ee-4a19-4663-8cb5-698ed0c17ee1
status: experimental
description: |
  A network connection to the Windows Remote Management ports, the WinRM host process, or an
  explicit remoting client (winrs, Enter-PSSession, Invoke-Command -ComputerName). Loopback
  traffic and local PowerShell do not match.
  Configuration-management and jump hosts open WinRM all day. List them in
  filter_management_hosts (source addresses) before you enable the rule. The shipped value
  198.18.0.0/15 is the benchmarking range and matches nothing real.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1021/006/
tags:
  - attack.lateral_movement
  - attack.t1021.006
logsource:
  category: network_connection
  product: windows
detection:
  winrm_port:
    event.action: network_connection
    DestinationPort:
      - 5985
      - 5986
  winrm_host:
    event.action: process_start
    message|contains:
      - wsmprovhost.exe
      - winrs.exe
      - Enter-PSSession
  winrm_invoke:
    event.action: process_start
    message|contains|all:
      - Invoke-Command
      - '-ComputerName'
  loopback:
    SourceIp|cidr:
      - 127.0.0.0/8
  filter_management_hosts:
    # Placeholder: replace 198.18.0.0/15 with the addresses of your management and jump hosts.
    SourceIp|cidr:
      - 198.18.0.0/15
  condition: (1 of winrm_*) and not loopback and not filter_management_hosts
falsepositives:
  - A configuration-management server opening WinRM to enrolled hosts, until filter_management_hosts lists it
level: medium
