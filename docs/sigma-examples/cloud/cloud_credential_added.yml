# A new IAM credential other than CreateAccessKey. CreateAccessKey and CreateUser are the
# shipped example. UpdateLoginProfile and UpdateAccessKey are omitted: the message names the
# call, not whether a password was reset or a key was deactivated.
# A denial appends " (errorCode)" and still matches. The action name is what was requested.
title: Cloud Credential Creation Requested
id: 4c8e2a17-5b60-4d3f-8e15-1a7c9d0e4f21
status: experimental
description: |
  An IAM call that requests a console password, a service-specific credential, a signing
  certificate, or an SSH public key. A denied call still matches. CreateAccessKey and
  CreateUser are a different example and do not match.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1098/001/
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.action: cloud_iam_change
    message|contains:
      - CreateLoginProfile on iam.amazonaws.com
      - CreateServiceSpecificCredential on iam.amazonaws.com
      - UploadSigningCertificate on iam.amazonaws.com
      - UploadSSHPublicKey on iam.amazonaws.com
  condition: selection
falsepositives:
  - An administrator enabling console access or publishing a signing key
level: high
