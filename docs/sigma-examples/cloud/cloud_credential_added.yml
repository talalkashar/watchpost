# A new credential on an IAM user: a key, a console password, or a signing credential.
# UpdateLoginProfile and UpdateAccessKey are omitted. Those names also cover password
# resets and key deactivation, and the normalized message does not say which.
title: Cloud Credential Added
id: a91c4e27-6b08-4d3f-8e15-2c7a9b0d4e63
status: experimental
description: |
  An IAM call that adds a credential an attacker can reuse. A denied call still matches.
  Watchpost keeps the action name and appends the errorCode, and the attempt is the signal.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1098/001/
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.action: cloud_iam_change
    message|contains:
      - CreateAccessKey on iam.amazonaws.com
      - CreateLoginProfile on iam.amazonaws.com
      - CreateServiceSpecificCredential on iam.amazonaws.com
      - UploadSigningCertificate on iam.amazonaws.com
      - UploadSSHPublicKey on iam.amazonaws.com
  condition: selection
falsepositives:
  - A pipeline or an administrator rotating an access key
  - An administrator enabling console access for a new hire
level: high
