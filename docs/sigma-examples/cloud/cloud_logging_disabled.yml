# DeleteLogGroup and DeleteDeliveryChannel only. StopLogging, DeleteTrail, DeleteFlowLogs,
# and StopConfigurationRecorder are the shipped example and are not repeated here.
# A denial appends " (errorCode)" and still matches. The file tags revoked T1562.008.
title: Cloud Logging Channel Deletion Requested
id: e5f1a2b6-7c27-4d90-a6c3-2d9e7b2f0a11
status: experimental
description: |
  A request to delete a CloudWatch log group or an AWS Config delivery channel. A denied call
  still matches. Stopping a trail, deleting a trail, deleting VPC flow logs, and stopping the
  Config recorder are a different example and do not match.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1562/008/
tags:
  - attack.defense_evasion
  - attack.t1562.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.action: cloud_api_call
    message|contains:
      - DeleteLogGroup on logs.amazonaws.com
      - DeleteDeliveryChannel on config.amazonaws.com
  condition: selection
falsepositives:
  - An administrator retiring a log group or a delivery channel
level: high
