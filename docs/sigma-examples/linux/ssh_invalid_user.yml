# SSH attempt against an account that does not exist (T1110.001). Distinct from guesses
# against a real privileged name: the sshd line says "invalid user".
title: Linux SSH Authentication For Invalid User
id: 7f3a1c90-2b64-4e17-9d08-a11c0e100004
status: experimental
description: |
  sshd rejected a password or connection for an account name that is not on the host.
  That is account guessing or a spray against default names, one event at a time.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1110/001/
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
detection:
  selection:
    event.action: auth_failure
    message|contains: 'invalid user '
  condition: selection
falsepositives:
  - A person mistyping an account name once
level: medium
