# sudo of a shell, interpreter, or netcat (T1548.003). The stored user is the invoker.
# su does not record the command, so a bare "(to root)" line stays out. A trailing
# space keeps "sh" off shutdown, shred, and sha256sum. A bare command uses endswith.
title: Linux Sudo Shell or Tool Requested as Root
id: 7f3a1c90-2b64-4e17-9d08-a11c0e100003
status: experimental
description: |
  sudo recorded a command for a shell, interpreter, or networking tool as root. The stored user is the account that
  invoked sudo, on the host in the syslog header. The target account is only in
  the message. An su line does not carry the shell command, so it stays out. A
  routine command such as systemctl restart does not match.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1548/003/
tags:
  - attack.privilege_escalation
  - attack.t1548.003
logsource:
  product: linux
  service: sudo
detection:
  shell_exact:
    event.action: privilege_escalation
    message|endswith:
      - ' ; USER=root ; COMMAND=/bin/bash'
      - ' ; USER=root ; COMMAND=/usr/bin/bash'
      - ' ; USER=root ; COMMAND=/bin/sh'
      - ' ; USER=root ; COMMAND=/usr/bin/sh'
      - ' ; USER=root ; COMMAND=/bin/dash'
      - ' ; USER=root ; COMMAND=/usr/bin/dash'
      - ' ; USER=root ; COMMAND=/bin/zsh'
      - ' ; USER=root ; COMMAND=/usr/bin/zsh'
      - ' ; USER=root ; COMMAND=/usr/bin/python'
      - ' ; USER=root ; COMMAND=/usr/bin/python3'
      - ' ; USER=root ; COMMAND=/usr/bin/perl'
      - ' ; USER=root ; COMMAND=/usr/bin/ruby'
      - ' ; USER=root ; COMMAND=/bin/nc'
      - ' ; USER=root ; COMMAND=/usr/bin/nc'
      - ' ; USER=root ; COMMAND=/usr/bin/ncat'
      - ' ; USER=root ; COMMAND=/usr/bin/socat'
  shell_args:
    event.action: privilege_escalation
    message|contains:
      - ' ; USER=root ; COMMAND=/bin/bash '
      - ' ; USER=root ; COMMAND=/usr/bin/bash '
      - ' ; USER=root ; COMMAND=/bin/sh '
      - ' ; USER=root ; COMMAND=/usr/bin/sh '
      - ' ; USER=root ; COMMAND=/bin/dash '
      - ' ; USER=root ; COMMAND=/usr/bin/dash '
      - ' ; USER=root ; COMMAND=/bin/zsh '
      - ' ; USER=root ; COMMAND=/usr/bin/zsh '
      - ' ; USER=root ; COMMAND=/usr/bin/python '
      - ' ; USER=root ; COMMAND=/usr/bin/python3 '
      - ' ; USER=root ; COMMAND=/usr/bin/perl '
      - ' ; USER=root ; COMMAND=/usr/bin/ruby '
      - ' ; USER=root ; COMMAND=/bin/nc '
      - ' ; USER=root ; COMMAND=/usr/bin/nc '
      - ' ; USER=root ; COMMAND=/usr/bin/ncat '
      - ' ; USER=root ; COMMAND=/usr/bin/socat '
  denied:
    message|contains:
      - ' is not in the sudoers file'
      - ' : user NOT in sudoers'
  root_invoker:
    user.name: root
  condition: (shell_exact or shell_args) and not denied and not root_invoker
falsepositives:
  - An administrator opening a root shell during maintenance
level: high
