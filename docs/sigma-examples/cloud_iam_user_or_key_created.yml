# IAM changes that create a principal or hand it a credential or a policy.
# Watchpost cloud messages are "<action> on <service>", so the action is matched at the start.
# Written for Watchpost's Sigma subset (docs/REFERENCE.md, "Sigma rule import").
title: Cloud IAM User Or Access Key Created
id: c31342f9-c756-4868-b9ab-330ffa2c2c78
status: experimental
description: |
  A cloud IAM change that creates a user, an access key, or a console password, or that
  attaches an identity policy. Reads and deletes do not match. A denied call is recorded
  with the same action name and does match. Each matching event is evidence; Watchpost
  groups them per source IP.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1136/003/
  - https://attack.mitre.org/techniques/T1098/001/
tags:
  - attack.persistence
  - attack.t1136.003
  - attack.t1098.001
logsource:
  category: cloud
  product: aws
detection:
  change:
    event.action: cloud_iam_change
  created:
    message|startswith:
      - 'CreateUser on '
      - 'CreateAccessKey on '
      - 'CreateLoginProfile on '
      - 'AttachUserPolicy on '
      - 'AttachRolePolicy on '
      - 'PutUserPolicy on '
      - 'PutRolePolicy on '
  condition: change and created
falsepositives:
  - A deployment pipeline that creates a user or attaches a policy on a schedule
  - A denied attempt that never created the credential
level: high
