# Password-spray tools aimed at a mailbox authentication surface. No count() threshold.
# Watchpost has no aggregation, so this matches the tool name or an explicit spray phrase.
title: Mail Password Spray Tool
id: 5500eeac-1d7f-483b-9699-851bed097433
status: experimental
description: |
  A known mailbox or Microsoft 365 password-spray tool named in the same event as a mail
  authentication URL or AUTH verb, or a log line that says "password spray" and names a mailbox,
  OWA, IMAP, or SMTP. One event cannot prove that many accounts were tried, so a spray that leaves
  neither the tool name nor that phrase does not match.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://github.com/dafthack/MSOLSpray
  - https://github.com/blacklanternsecurity/TREVORspray
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  category: authentication
  product: m365
detection:
  tool:
    event.action:
      - auth_failure
      - auth_success
      - web_request
      - web_error
      - web_scan
      - account_lockout
    message|contains:
      - 'MSOLSpray'
      - 'o365spray'
      - 'TREVORspray'
      - 'MailSniper'
      - 'CredMaster'
      - 'Go365'
      - 'TeamFiltration'
  mail_auth:
    message|contains:
      - '/owa/auth'
      - '/ews/'
      - '/Microsoft-Server-ActiveSync'
      - 'login.microsoftonline.com'
      - 'outlook.office365.com'
      - 'imap-login'
      - 'pop3-login'
      - 'AUTH LOGIN'
      - 'AUTH PLAIN'
      - 'SMTP AUTH'
  spray_mailbox:
    event.action:
      - auth_failure
      - web_request
      - web_error
      - account_lockout
    message|contains|all:
      - 'password spray'
      - 'mailbox'
  spray_owa:
    event.action:
      - auth_failure
      - web_request
      - web_error
      - account_lockout
    message|contains|all:
      - 'password spray'
      - 'owa'
  spray_imap:
    event.action:
      - auth_failure
      - web_request
      - web_error
      - account_lockout
    message|contains|all:
      - 'password spray'
      - 'imap'
  spray_smtp:
    event.action:
      - auth_failure
      - web_request
      - web_error
      - account_lockout
    message|contains|all:
      - 'password spray'
      - 'smtp'
  condition: (tool and mail_auth) or 1 of spray_*
falsepositives:
  - A write-up or ticket that quotes both a tool name and a mail authentication URL
  - A red-team exercise that runs one of these tools on purpose
level: high
