# Completed calls that stop or delete cloud audit logging. The message is the whole
# "<action> on <service>" line. A denial appends " (errorCode)" and does not match.
# UpdateTrail is omitted on purpose: the event names the call, not whether logging stayed on.
# Written for Watchpost's Sigma subset (docs/REFERENCE.md, "Sigma rule import").
title: Cloud Audit Logging Stopped
id: 84cc5745-a86f-4a51-8cdf-90fcd87cb05c
status: experimental
description: |
  A completed cloud API call that stops or deletes a CloudTrail trail, deletes VPC flow
  logs, or stops the AWS Config recorder. The message must be exactly one of those four
  "<action> on <service>" lines. A denied call, a describe, and an update do not match.
  Each matching event is evidence; Watchpost groups them per source IP.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1562/008/
tags:
  - attack.defense_evasion
  - attack.t1562.008
logsource:
  category: cloud
  product: aws
detection:
  call:
    event.action: cloud_api_call
  stopped:
    message:
      - 'StopLogging on cloudtrail.amazonaws.com'
      - 'DeleteTrail on cloudtrail.amazonaws.com'
      - 'DeleteFlowLogs on ec2.amazonaws.com'
      - 'StopConfigurationRecorder on config.amazonaws.com'
  condition: call and stopped
falsepositives:
  - An operator retiring a trail during a reviewed migration
level: critical
