# Actions that stop or delete cloud audit logging. UpdateTrail is omitted on purpose:
# the event names the call, not whether logging stayed on.
# Written for Watchpost's Sigma subset (docs/REFERENCE.md, "Sigma rule import").
title: Cloud Audit Logging Stopped
id: 84cc5745-a86f-4a51-8cdf-90fcd87cb05c
status: experimental
description: |
  A cloud API call that stops or deletes a CloudTrail trail, deletes VPC flow logs, or
  stops the AWS Config recorder. The action is the start of Watchpost's "<action> on
  <service>" message, so a describe or an update does not match. A denied call still
  matches. Each matching event is evidence; Watchpost groups them per source IP.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1562/008/
tags:
  - attack.defense_evasion
  - attack.t1562.008
logsource:
  category: cloud
  product: aws
detection:
  call:
    event.action: cloud_api_call
  stopped:
    message|startswith:
      - 'StopLogging on '
      - 'DeleteTrail on '
      - 'DeleteFlowLogs on '
      - 'StopConfigurationRecorder on '
  condition: call and stopped
falsepositives:
  - An operator retiring a trail during a reviewed migration
  - A denied attempt that left logging on
level: critical
