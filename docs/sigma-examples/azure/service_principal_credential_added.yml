# Entra ID (Azure AD) audit: a new secret or certificate on a service principal or application.
# Creating the service principal itself does not match; only the credential phrases do.
title: Azure AD Service Principal Credential Added
id: 8e2b6d41-1c73-4a95-b0e8-5f3c9d2a71b4
status: experimental
description: |
  An Entra ID audit event recorded a new credential on a service principal, or a change under
  application certificates and secrets. A new password or certificate on an app identity is a
  durable key an attacker can use after the session that created it is gone.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1098/001/
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    event.action:
      - cloud_iam_change
      - cloud_api_call
    message|contains:
      - Add service principal credentials
      - Certificates and secrets management
  condition: selection
falsepositives:
  - A planned rotation of an application certificate or client secret
level: high
