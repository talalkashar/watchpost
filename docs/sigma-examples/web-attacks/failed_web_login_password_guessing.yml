# One failed web login. Watchpost does not implement Sigma count(), so the rule matches each failure
# and the engine groups them by source IP. Paths are login endpoints, not every 401.
title: Failed Web Login Password Guessing
id: 0d5e9a72-3b14-4f68-a1c9-7e2b8d4f6c03
status: experimental
description: |
  A web login path returned 401 or 403. A single miss is weak; Watchpost groups matching events per
  source IP, so a string of guesses against wp-login, xmlrpc, or an API login becomes one finding.
  A 401 on any other path does not match.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1110/001/
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  category: webserver
detection:
  web:
    event.action:
      - web_request
      - web_scan
      - web_error
  login:
    message|contains:
      - /wp-login.php
      - /xmlrpc.php
      - /user/login
      - /admin/login
      - /api/login
      - /oauth/token
      - /account/login
      - /auth/login
  failure:
    message|contains:
      - '-> 401'
      - '-> 403'
  condition: web and login and failure
falsepositives:
  - A person who mistyped a password once
  - An API client whose session expired on a path that contains one of these login suffixes
level: medium
