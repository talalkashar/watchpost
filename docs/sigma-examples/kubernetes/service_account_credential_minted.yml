# A new long-lived service-account token secret, or a TokenRequest, by someone other than a node or a kube-system controller.
title: Kubernetes Service Account Credential Minted
id: 6e0c3f91-7b42-4d85-8e16-1a9f5c2d7b38
status: experimental
description: |
  A Kubernetes API audit event that creates a credential for a service account:
  either a Secret of type kubernetes.io/service-account-token or a create on the
  serviceaccounts/token subresource. Kubelet and control-plane users are excluded.
  Each matching event is evidence of a new credential on a cluster account.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/#create-token
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  audit:
    message|contains: audit.k8s.io
  minted:
    message|contains:
      - kubernetes.io/service-account-token
      - '"subresource":"token"'
      - '"subresource": "token"'
  verb:
    message|contains:
      - '"verb":"create"'
      - '"verb": "create"'
  controllers:
    user:
      - system:kube*
      - system:node:*
      - system:serviceaccount:kube-system:*
  condition: audit and minted and verb and not controllers
falsepositives:
  - A deploy job that mints a short-lived token for an application service account
level: high
