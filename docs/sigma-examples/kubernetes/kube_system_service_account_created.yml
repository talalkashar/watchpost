# Create of a ServiceAccount in kube-system. Controllers and token mints are excluded.
# The principal is the event user field, which a shipper copies from the audit username.
title: Kube-System Service Account Created
id: 2b7d9e05-3a18-4c64-a5f0-9e1c8d6b4a27
status: experimental
description: |
  A Kubernetes API audit event that creates a ServiceAccount in the kube-system
  namespace. Control-plane users and the serviceaccounts/token subresource are
  excluded, so this is a new cluster service account in the control plane rather
  than the controller reconciling the default account or a token mint.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1136/003/
  - https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
tags:
  - attack.persistence
  - attack.t1136.003
logsource:
  category: application
  product: kubernetes
  service: audit
detection:
  created:
    message|contains|all:
      - audit.k8s.io
      - /namespaces/kube-system/serviceaccounts
  verb:
    message|contains:
      - '"verb":"create"'
      - '"verb": "create"'
  token_mint:
    message|contains:
      - '"subresource":"token"'
      - '"subresource": "token"'
      - kubernetes.io/service-account-token
  controllers:
    user:
      - system:kube*
      - system:node:*
      - system:serviceaccount:kube-system:*
  condition: created and verb and not token_mint and not controllers
falsepositives:
  - Helm, a GitOps controller, or an operator install running as a human or app account and creating a kube-system service account
level: medium
