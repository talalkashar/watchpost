# The IdP's own password-spray verdict (Entra ID Protection, Okta ThreatInsight).
# Watchpost's Sigma subset has no count aggregation, so this rule does not try to count
# failures. It matches one alert that already names the spray and the product that raised it.
title: SaaS IdP Password Spray Alert
id: a91d0c34-2e57-4b8a-8f16-3c5d7e90ab12
status: experimental
description: |
  An identity-provider alert that names a password spray. Both the spray phrase and a
  product token must be in the message, so a single bad password or a note that only
  says "password spray" does not match. Each match is one event; Watchpost groups them
  per source IP.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1110/003/
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  category: authentication
  product: saas
detection:
  named:
    message|contains:
      - password spray
      - passwordspray
  product:
    message|contains:
      - Identity Protection
      - ThreatInsight
      - riskEventType
      - security.threat.detected
  condition: named and product
falsepositives:
  - A detection-engineering ticket that quotes both the spray phrase and the product name
level: high
