# A new long-lived credential on a SaaS or cloud identity: access key, app secret, API token,
# OAuth grant, or authorized API client. Listing existing keys does not match.
title: SaaS OAuth Credential Created
id: b3e6f178-90c4-4a2d-b7e5-6d1f4a8c0e23
status: experimental
description: |
  Someone created an additional cloud or SaaS credential. The message must name one of
  these operations: AWS CreateAccessKey, Azure AD "Add service principal credentials.",
  GitHub oauth_authorization.create, Okta system.api_token.create, or Google Workspace
  AUTHORIZE_API_CLIENT_ACCESS. Each match is one event; Watchpost groups them per source IP.
author: Watchpost example
date: 2026-11-18
references:
  - https://attack.mitre.org/techniques/T1098/001/
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  category: iam
  product: saas
detection:
  credential:
    message|contains:
      - CreateAccessKey
      - Add service principal credentials.
      - oauth_authorization.create
      - system.api_token.create
      - AUTHORIZE_API_CLIENT_ACCESS
  condition: credential
falsepositives:
  - A deployment job that rotates a service credential on a known host
level: high
